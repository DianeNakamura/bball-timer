<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="🏀タイマー">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>🏀 練習タイマー</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
body {
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 6px;
}

/* ==================== TIMER (top) ==================== */
.timer-box { background: #1a1a1a; border-radius: 12px; padding: 12px 14px; margin: 6px 6px 0; display: flex; flex-direction: column; align-items: center; }
.timer-label { font-size: clamp(.65rem, 2.5vmin, .85rem); opacity: .55; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.timer-time { font-size: clamp(3.5rem, 18vmin, 7rem); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.04em; color: #27ae60; cursor: pointer; }
.timer-time.paused { color: #f39c12; }
.timer-time.zero { color: #e74c3c; animation: flash 0.5s infinite; }
@keyframes flash { 50% { opacity: 0.3; } }
.timer-btns { display: flex; gap: 6px; margin-top: 8px; width: 100%; max-width: 360px; }
.timer-btns button { flex: 1; padding: 10px 0; font-size: clamp(.85rem, 3.5vmin, 1.05rem); border: none; border-radius: 8px; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; font-weight: 700; }
.timer-btns button.primary { background: #27ae60; }
.timer-btns button.primary.paused { background: #e67e22; }
.timer-btns button:active { transform: scale(.96); }

/* ==================== SCORES ==================== */
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 6px; min-height: 0; }
.team { background: linear-gradient(180deg, #1a1a1a, #050505); border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-width: 0; }
.team.home { border: 2px solid #d35400; }
.team.away { border: 2px solid #2980b9; }
.team-name { font-size: clamp(.85rem, 3.5vmin, 1.2rem); font-weight: 700; opacity: .85; cursor: pointer; margin-bottom: 4px; padding: 2px 8px; border-radius: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-name:active { background: rgba(255,255,255,.1); }
.score-num { font-size: clamp(5rem, 30vmin, 11rem); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.05em; }
.team.home .score-num { color: #f39c12; }
.team.away .score-num { color: #5dade2; }
.score-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; width: 100%; margin-top: 8px; }
.score-btns button { font-size: clamp(1rem, 4.5vmin, 1.4rem); font-weight: 800; padding: 11px 0; border-radius: 8px; border: none; background: rgba(255,255,255,.1); color: #fff; cursor: pointer; }
.score-btns button:active { transform: scale(.95); background: rgba(255,255,255,.22); }
.minus-btn { width: 100%; margin-top: 5px; padding: 8px 0; font-size: clamp(.85rem, 3.5vmin, 1.05rem); font-weight: 700; border-radius: 8px; border: 1px solid rgba(231, 76, 60, .4); background: rgba(231, 76, 60, .12); color: #fff; cursor: pointer; }
.minus-btn:active { transform: scale(.95); background: rgba(231, 76, 60, .3); }
.possession { position: absolute; top: 6px; font-size: 1.5rem; opacity: 0; transition: opacity .2s; }
.team.home .possession { right: 8px; }
.team.away .possession { left: 8px; }
.team.has-poss .possession { opacity: 1; }

/* ==================== BOTTOM BAR ==================== */
.bottom-bar { display: flex; gap: 5px; padding: 0 6px 6px; }
.bottom-bar button { flex: 1; padding: 9px; font-size: clamp(.75rem, 2.8vmin, .9rem); border: 1px solid rgba(255,255,255,.2); border-radius: 6px; background: transparent; color: #fff; cursor: pointer; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bottom-bar button:active { background: rgba(255,255,255,.15); }

/* ==================== MODAL ==================== */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal-bg.show { display: flex; }
.modal { background: #1a1a1a; border-radius: 14px; padding: 18px; max-width: 90vw; max-height: 85vh; overflow-y: auto; min-width: 280px; }
.modal h2 { margin: 0 0 12px; font-size: 1.05rem; }
.modal input { width: 100%; padding: 10px; font-size: 1rem; background: #0a0a0a; color: #fff; border: 1px solid #444; border-radius: 6px; margin-bottom: 10px; }
.modal .row { display: flex; gap: 8px; margin-bottom: 10px; }
.modal button { padding: 10px 14px; font-size: .9rem; border-radius: 6px; border: none; background: #2980b9; color: #fff; font-weight: 600; cursor: pointer; flex: 1; }
.modal button.secondary { background: #555; }
.modal button.danger { background: #c0392b; }
.history-item { padding: 8px; border-bottom: 1px solid #333; font-size: .85rem; }
.preset-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
.preset-btns button { padding: 8px 0; background: #333; }

/* ==================== 横画面（landscape） ==================== */
@media (orientation: landscape) and (max-height: 500px) {
  body { grid-template-rows: 1fr auto; gap: 4px; }
  .timer-box { display: none; }
  /* In landscape, timer is placed inside .scores center column */
  .scores {
    grid-template-columns: 1fr auto 1fr;
    padding: 4px;
    gap: 6px;
  }
  .timer-mid { display: flex !important; flex-direction: column; align-items: center; justify-content: center; min-width: 28vw; padding: 6px; background: #1a1a1a; border-radius: 12px; }
  .timer-mid .timer-label { margin-bottom: 2px; }
  .timer-mid .timer-time { font-size: clamp(2.2rem, 13vmin, 4.5rem); }
  .timer-mid .timer-btns { max-width: none; margin-top: 6px; }
  .timer-mid .timer-btns button { padding: 7px 0; font-size: .8rem; }
  .team { padding: 6px 6px; }
  .team-name { font-size: clamp(.75rem, 3vmin, 1rem); margin-bottom: 2px; }
  .score-num { font-size: clamp(3.5rem, 22vmin, 8rem); }
  .score-btns { gap: 4px; margin-top: 5px; }
  .score-btns button { padding: 8px 0; font-size: clamp(.9rem, 4vmin, 1.2rem); }
  .minus-btn { padding: 6px 0; margin-top: 4px; font-size: .85rem; }
  .bottom-bar { padding: 0 4px 4px; gap: 4px; }
  .bottom-bar button { padding: 6px; font-size: .72rem; }
}
.timer-mid { display: none; }
</style>
</head>
<body>

<!-- ==================== TIMER (portrait) ==================== -->
<div class="timer-box">
  <div class="timer-label">プレイ時間</div>
  <div class="timer-time" id="timerTime" onclick="editMainTime()">10:00</div>
  <div class="timer-btns">
    <button class="primary" id="mainBtn" onclick="toggleMain()">▶ START</button>
    <button onclick="resetMain()">RESET</button>
    <button onclick="editMainTime()">⚙ 時間設定</button>
  </div>
</div>

<!-- ==================== SCORES ==================== -->
<div class="scores">
  <div class="team home" id="teamHome">
    <span class="possession">🏀</span>
    <div class="team-name" onclick="editTeamName('home')" id="nameHome">HOME</div>
    <div class="score-num" id="scoreHome">0</div>
    <div class="score-btns">
      <button onclick="addScore('home', 1)">+1</button>
      <button onclick="addScore('home', 2)">+2</button>
      <button onclick="addScore('home', 3)">+3</button>
    </div>
    <button class="minus-btn" onclick="addScore('home', -1)">−1</button>
  </div>

  <!-- 横画面ではここに timer が表示される -->
  <div class="timer-mid">
    <div class="timer-label">プレイ時間</div>
    <div class="timer-time" id="timerTimeMid" onclick="editMainTime()">10:00</div>
    <div class="timer-btns">
      <button class="primary" id="mainBtnMid" onclick="toggleMain()">▶ START</button>
      <button onclick="resetMain()">RESET</button>
      <button onclick="editMainTime()">⚙ 設定</button>
    </div>
  </div>

  <div class="team away" id="teamAway">
    <span class="possession">🏀</span>
    <div class="team-name" onclick="editTeamName('away')" id="nameAway">AWAY</div>
    <div class="score-num" id="scoreAway">0</div>
    <div class="score-btns">
      <button onclick="addScore('away', 1)">+1</button>
      <button onclick="addScore('away', 2)">+2</button>
      <button onclick="addScore('away', 3)">+3</button>
    </div>
    <button class="minus-btn" onclick="addScore('away', -1)">−1</button>
  </div>
</div>

<!-- ==================== BOTTOM BAR ==================== -->
<div class="bottom-bar">
  <button onclick="togglePossession()">🏀 ポゼッション</button>
  <button onclick="saveGame()">💾 保存</button>
  <button onclick="resetAll()">🔄 リセット</button>
  <button onclick="showHistory()">📊 履歴</button>
</div>

<!-- ==================== MODALS ==================== -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ==================== STATE ====================
let state = {
  home: { score: 0, name: 'HOME' },
  away: { score: 0, name: 'AWAY' },
  possession: null,
  main: { time: 600, initial: 600, running: false, lastTick: 0 }
};

// ==================== AUDIO ====================
let audioCtx = null;
function beep(freq = 880, dur = 0.15, type = 'square') {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.value = 0.3;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
let _hornStop = null;
function buzzerLong(duration = 3) {
  // 電子メロディ: ドミソド の上昇アルペジオを繰り返す
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    const noteDur = 0.20;
    const gap = 0.04;
    const cycleLen = notes.length * (noteDur + gap);
    const repeats = Math.max(1, Math.floor(duration / cycleLen));
    const startNow = audioCtx.currentTime;
    const oscList = [];
    for (let r = 0; r < repeats; r++) {
      for (let i = 0; i < notes.length; i++) {
        const t0 = startNow + r * cycleLen + i * (noteDur + gap);
        // 主音 + 1オクターブ上で厚み
        for (const [f, vol] of [[notes[i], 0.32], [notes[i] * 2, 0.10]]) {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.value = f;
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(vol, t0 + 0.015);
          g.gain.setValueAtTime(vol, t0 + noteDur - 0.06);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + noteDur);
          osc.connect(g).connect(audioCtx.destination);
          osc.start(t0); osc.stop(t0 + noteDur);
          oscList.push(osc);
        }
      }
    }
    _hornStop = () => { for (const o of oscList) { try { o.stop(); } catch(e){} } _hornStop = null; };
  } catch(e) {}
  if (navigator.vibrate) navigator.vibrate([180,80,180,80,180,80,180]);
}
function stopHorn() { if (_hornStop) { _hornStop(); if (navigator.vibrate) navigator.vibrate(0); } }
document.addEventListener('click', () => { if (_hornStop) stopHorn(); }, true);

// ==================== WAKE LOCK ====================
let wakeLock = null;
async function acquireWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.main.running) acquireWakeLock();
});

// ==================== SCORE ====================
function addScore(team, delta) {
  state[team].score = Math.max(0, state[team].score + delta);
  render(); save();
}
function editTeamName(team) {
  showModal(`
    <h2>${team === 'home' ? 'HOME' : 'AWAY'}チーム名</h2>
    <input id="modalInput" value="${state[team].name}" maxlength="12">
    <div class="row">
      <button onclick="closeModal()" class="secondary">キャンセル</button>
      <button onclick="state['${team}'].name = document.getElementById('modalInput').value || '${team.toUpperCase()}'; render(); save(); closeModal();">保存</button>
    </div>
  `);
  setTimeout(() => document.getElementById('modalInput').select(), 100);
}
function togglePossession() {
  state.possession = state.possession === 'home' ? 'away' : (state.possession === 'away' ? null : 'home');
  render(); save();
}

// ==================== MAIN CLOCK ====================
function formatTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function toggleMain() {
  state.main.running = !state.main.running;
  if (state.main.running) { state.main.lastTick = Date.now(); acquireWakeLock(); beep(440, 0.08); }
  render(); save();
}
function resetMain() {
  state.main.running = false;
  state.main.time = state.main.initial;
  render(); save();
}
function editMainTime() {
  if (state.main.running) return;
  showModal(`
    <h2>プレイ時間設定</h2>
    <div class="preset-btns">
      <button onclick="setMainTime(60)">1分</button>
      <button onclick="setMainTime(180)">3分</button>
      <button onclick="setMainTime(300)">5分</button>
      <button onclick="setMainTime(420)">7分</button>
      <button onclick="setMainTime(600)">10分</button>
      <button onclick="setMainTime(720)">12分</button>
      <button onclick="setMainTime(900)">15分</button>
      <button onclick="setMainTime(1200)">20分</button>
    </div>
    <div class="row" style="align-items:center">
      <input id="modalMin" type="number" value="${Math.floor(state.main.initial / 60)}" min="0" max="99" style="flex:1" placeholder="分">
      <span style="font-size:1.2rem">:</span>
      <input id="modalSec" type="number" value="${state.main.initial % 60}" min="0" max="59" style="flex:1" placeholder="秒">
    </div>
    <div class="row">
      <button onclick="closeModal()" class="secondary">キャンセル</button>
      <button onclick="const m=+document.getElementById('modalMin').value||0; const s=+document.getElementById('modalSec').value||0; setMainTime(m*60+s);">設定</button>
    </div>
  `);
}
function setMainTime(sec) {
  state.main.initial = sec;
  state.main.time = sec;
  state.main.running = false;
  render(); save(); closeModal();
}

// ==================== TICK ====================
function tick() {
  const now = Date.now();
  const c = state.main;
  if (c.running) {
    const dt = (now - c.lastTick) / 1000;
    const prev = c.time;
    c.time -= dt;
    c.lastTick = now;
    if (c.time <= 0) {
      c.time = 0;
      c.running = false;
      buzzerLong(3);
      save();
    }
    if (Math.ceil(prev) !== Math.ceil(c.time)) render();
  }
  requestAnimationFrame(tick);
}

// ==================== RENDER ====================
function render() {
  document.getElementById('scoreHome').textContent = state.home.score;
  document.getElementById('scoreAway').textContent = state.away.score;
  document.getElementById('nameHome').textContent = state.home.name;
  document.getElementById('nameAway').textContent = state.away.name;
  document.getElementById('teamHome').classList.toggle('has-poss', state.possession === 'home');
  document.getElementById('teamAway').classList.toggle('has-poss', state.possession === 'away');

  const cls = 'timer-time' + (state.main.time === 0 ? ' zero' : (state.main.running ? '' : ' paused'));
  const txt = formatTime(state.main.time);
  for (const id of ['timerTime', 'timerTimeMid']) {
    const el = document.getElementById(id);
    if (el) { el.textContent = txt; el.className = cls; }
  }
  for (const id of ['mainBtn', 'mainBtnMid']) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = state.main.running ? '⏸ PAUSE' : '▶ START';
      el.className = 'primary' + (state.main.running ? ' paused' : '');
    }
  }
}

// ==================== STORAGE ====================
function save() {
  try { localStorage.setItem('bball_state', JSON.stringify(state)); } catch(e) {}
}
function load() {
  try {
    const s = localStorage.getItem('bball_state');
    if (s) {
      const loaded = JSON.parse(s);
      loaded.main.running = false;
      // Drop legacy fields if present
      delete loaded.home.foul; delete loaded.home.to;
      delete loaded.away.foul; delete loaded.away.to;
      delete loaded.shot; delete loaded.timeout;
      state = loaded;
    }
  } catch(e) {}
}

// ==================== HISTORY ====================
function saveGame() {
  const history = JSON.parse(localStorage.getItem('bball_history') || '[]');
  history.unshift({
    date: new Date().toLocaleString('ja-JP'),
    home: { name: state.home.name, score: state.home.score },
    away: { name: state.away.name, score: state.away.score }
  });
  localStorage.setItem('bball_history', JSON.stringify(history.slice(0, 50)));
  showModal(`<h2>保存しました</h2><p>${state.home.name} ${state.home.score} - ${state.away.score} ${state.away.name}</p><div class="row"><button onclick="closeModal()">OK</button></div>`);
}
function showHistory() {
  const history = JSON.parse(localStorage.getItem('bball_history') || '[]');
  const html = history.length === 0
    ? '<p style="opacity:.6">履歴なし</p>'
    : history.map((g) => `<div class="history-item">${g.date}<br><b>${g.home.name} ${g.home.score} - ${g.away.score} ${g.away.name}</b></div>`).join('');
  showModal(`
    <h2>📊 試合履歴（直近50件）</h2>
    ${html}
    <div class="row" style="margin-top:12px">
      <button onclick="closeModal()" class="secondary">閉じる</button>
      ${history.length > 0 ? '<button onclick="if(confirm(\'履歴を全削除しますか？\')){localStorage.removeItem(\'bball_history\');closeModal();}" class="danger">全削除</button>' : ''}
    </div>
  `);
}

// ==================== RESET ====================
function resetAll() {
  if (!confirm('スコアとタイマーを全リセットしますか？')) return;
  state.home.score = 0;
  state.away.score = 0;
  state.possession = null;
  state.main.time = state.main.initial;
  state.main.running = false;
  render(); save();
}

// ==================== MODAL ====================
function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target.id === 'modalBg') closeModal();
});

// ==================== INIT ====================
load();
render();
tick();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
